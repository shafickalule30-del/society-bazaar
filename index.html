<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Society Bazaar</title>
  <link rel="stylesheet" href="style.css?v=2">
  <link rel="manifest" href="manifest.json">
  <meta name="theme-color" content="#075E54">
</head>
<body>

  <header class="app-header">
    <h1>🏘️ Society Bazaar</h1>
    <p class="subtitle">Local products from your neighbours</p>
  </header>

  <div id="notify-banner" class="notify-banner" style="display:none;">
    <span>🔔 Get notified when new products are posted</span>
    <button onclick="enableNotifications()">Enable</button>
  </div>

  <main id="feed" class="feed">
    <div class="loading">Loading products…</div>
  </main>

  <!-- Supabase -->
  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <!-- Firebase -->
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-app-compat.js"></script>
  <script src="https://www.gstatic.com/firebasejs/10.7.0/firebase-messaging-compat.js"></script>
  <!-- Your code -->
  <script src="config.js"></script>
  <script src="app.js"></script>
</body>
</html>
