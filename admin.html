<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin · Society Bazaar</title>
  <link rel="stylesheet" href="style.css">
  <style>
    .admin-container {
      max-width: 600px;
      margin: 0 auto;
      padding: 16px;
    }
    .form-group {
      margin-bottom: 14px;
    }
    .form-group label {
      display: block;
      font-size: 13px;
      font-weight: 600;
      margin-bottom: 6px;
      color: #333;
    }
    .form-group input,
    .form-group textarea {
      width: 100%;
      padding: 12px;
      border: 1px solid #ddd;
      border-radius: 8px;
      font-size: 15px;
      font-family: inherit;
      background: white;
    }
    .form-group textarea {
      min-height: 80px;
      resize: vertical;
    }
    .form-group input:focus,
    .form-group textarea:focus {
      outline: none;
      border-color: #075E54;
    }
    .submit-btn {
      width: 100%;
      background: #075E54;
      color: white;
      border: none;
      padding: 14px;
      border-radius: 8px;
      font-size: 16px;
      font-weight: 600;
      cursor: pointer;
      margin-top: 6px;
    }
    .submit-btn:disabled {
      background: #999;
    }
    .status-msg {
      margin-top: 12px;
      padding: 12px;
      border-radius: 8px;
      font-size: 14px;
      display: none;
    }
    .status-msg.success {
      background: #d4edda;
      color: #155724;
      display: block;
    }
    .status-msg.error {
      background: #f8d7da;
      color: #721c24;
      display: block;
    }
    .hint {
      font-size: 12px;
      color: #888;
      margin-top: 4px;
    }
  </style>
</head>
<body>

  <header class="app-header">
    <h1>⚙️ Admin Panel</h1>
    <p class="subtitle">Post a product to your society</p>
  </header>

  <div class="admin-container">
    <form id="post-form">

      <div class="form-group">
        <label for="title">Product Name *</label>
        <input type="text" id="title" required placeholder="e.g. Fresh Alphonso Mangoes">
      </div>

      <div class="form-group">
        <label for="price">Price *</label>
        <input type="text" id="price" required placeholder="e.g. ₹80/kg or UGX 5,000">
      </div>

      <div class="form-group">
        <label for="seller">Seller Name *</label>
        <input type="text" id="seller" required placeholder="e.g. Raj from Block A">
      </div>

      <div class="form-group">
        <label for="whatsapp">Seller WhatsApp Number *</label>
        <input type="tel" id="whatsapp" required placeholder="e.g. 919876543210">
        <div class="hint">Include country code, no + or spaces. Example: 2567XXXXXXXX</div>
      </div>

      <div class="form-group">
        <label for="description">Description</label>
        <textarea id="description" placeholder="Short description of the product…"></textarea>
      </div>

      <div class="form-group">
  <label>Product Image (optional)</label>
  <input type="file" id="image_file" accept="image/*" style="display:none">
  <button type="button" id="pick-image-btn" class="submit-btn" style="background:#128C7E;margin-bottom:8px;">
    📷 Choose Image
  </button>
  <div id="image-preview" style="display:none;">
    <img id="preview-img" style="width:100%;border-radius:8px;margin-top:8px;" />
    <button type="button" id="remove-image-btn" style="background:none;border:none;color:#c00;font-size:13px;margin-top:6px;cursor:pointer;">
      ✕ Remove image
    </button>
  </div>
  <input type="hidden" id="image_url">
  <div class="hint" id="upload-status"></div>
</div>

      <button type="submit" class="submit-btn" id="submit-btn">Post Product</button>
      <div class="status-msg" id="status-msg"></div>

    </form>
  </div>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="config.js"></script>
  <script src="admin.js"></script>
</body>
